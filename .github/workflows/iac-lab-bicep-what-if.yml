name: IaC Lab Bicep What-If

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  what-if:
    name: Azure Bicep what-if with OIDC
    runs-on: ubuntu-latest
    environment: iac-lab
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure login with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Bicep what-if
        run: |
          az deployment sub what-if \
            --location eastus2 \
            --template-file labs/azure-iac-dual-stack/bicep/main.bicep \
            --parameters labs/azure-iac-dual-stack/bicep/dev.bicepparam
