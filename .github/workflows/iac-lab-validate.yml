name: IaC Lab Validate

on:
  pull_request:
    paths:
      - 'labs/azure-iac-dual-stack/**'
      - '.github/workflows/iac-lab-validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt + validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: labs/azure-iac-dual-stack/terraform
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.14.4

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        run: terraform validate -no-color

  bicep:
    name: Bicep compile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install current Bicep CLI through Azure CLI
        run: az bicep install

      - name: Show Bicep version
        run: az bicep version

      - name: Build Bicep template
        run: az bicep build --file labs/azure-iac-dual-stack/bicep/main.bicep --stdout > /dev/null
